# /etc/nginx/sites-available/llm-gateway
#
# Замінити YOUR_DOMAIN на свій домен або IP VPS
# Для SSL: sudo certbot --nginx -d YOUR_DOMAIN

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Редірект на HTTPS (розкоментуй після certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Таймаути для довгих LLM-запитів
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;

        # Розмір тіла (великі промпти)
        client_max_body_size 10M;
    }
}

